name: Build jar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Unpack project
        run: unzip -q blackcat-client-26.2.zip
      - name: Build
        working-directory: blackcat-client-26.2
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blackcat-client-jar
          path: |
            blackcat-client-26.2/build/libs/*.jar
            !blackcat-client-26.2/build/libs/*-sources.jar
