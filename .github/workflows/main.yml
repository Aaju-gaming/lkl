name: Build jar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Unpack project
        run: unzip -q "$(LC_ALL=C ls *.zip | head -1)"
      - name: Get Gradle (with fallbacks)
        run: |
          ok=0
          for url in \
            https://services.gradle.org/distributions/gradle-9.5.1-bin.zip \
            https://downloads.gradle.org/distributions/gradle-9.5.1-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-9.5.1-bin.zip \
            https://mirrors.aliyun.com/gradle/gradle-9.5.1-bin.zip; do
            echo "Trying $url"
            if curl -fL --retry 4 --retry-all-errors --retry-delay 10 -o gradle.zip "$url"; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "All Gradle downloads failed"; exit 1; }
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.5.1/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: blackcat-client-26.2
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blackcat-client-jar
          path: |
            blackcat-client-26.2/build/libs/*.jar
            !blackcat-client-26.2/build/libs/*-sources.jar
