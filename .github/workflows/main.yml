name: Build jar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Unpack project
        run: unzip -q blackcat-client-26.2.zip
      - name: Get Gradle (with retries)
        run: |
          curl -fL --retry 10 --retry-all-errors --retry-delay 15 -o gradle.zip https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.5.1/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: blackcat-client-26.2
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blackcat-client-jar
          path: |
            blackcat-client-26.2/build/libs/*.jar
            !blackcat-client-26.2/build/libs/*-sources.jar
